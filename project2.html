<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Project Two</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="projects.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <style>
    .project-detail {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }

    .project-detail h1 {
      font-size: 1.8rem;
      color: #00ff77;
      margin-bottom: 1rem;
      border-bottom: 1px solid #00ff77;
      padding-bottom: 0.3rem;
      text-shadow: 0 0 8px rgba(0, 255, 119, 0.4);
    }

    .project-detail img {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
      border: 2px solid #00ff77;
      border-radius: 4px;
      margin: 1.5rem auto;
      box-shadow: 0 0 20px rgba(0, 255, 119, 0.15);
    }

    .project-detail p {
      color: #00ff77;
      line-height: 1.6;
      font-size: 1rem;
      margin-top: 1rem;
      text-align: justify;
    }

    .back-link {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #00ffff;
      text-decoration: none;
      font-family: 'Fira Code', monospace;
      transition: all 0.3s;
    }

    .back-link:hover {
      text-decoration: underline;
      text-shadow: 0 0 5px #00ffff;
    }

    .download-btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 10px 20px;
      background-color: #00ff77;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      font-family: 'Fira Code', monospace;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      background-color: #00cc66;
      box-shadow: 0 0 10px rgba(0, 255, 119, 0.4);
    }
  </style>
</head>
<body>
  <div class="terminal-container project-detail">
    <h1>Coming Soon</h1>

    <img src="https://raw.githubusercontent.com/drew109/drew109.github.io/main/assets/projects/CONS.png" alt="Project 2 Screenshot" />

    <p>
    </p>
    <br />
    <a href="projects.html" class="back-link">← Back to Projects Catalog</a>
    
  </div>
</body>
</html>
