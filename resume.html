<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Resume</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="resume.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .resume-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 950px;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }

    .resume-container {
      width: 100%;
      aspect-ratio: 8.5 / 11;
      border: 2px solid #00ff77;
      border-radius: 6px;
      overflow: hidden;
      background: black;
      box-shadow: 0 0 20px rgba(0, 255, 119, 0.2);
    }

    .resume-pdf {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .resume-buttons {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 950px;
      margin-top: 1.2rem;
    }

    .resume-buttons a {
      padding: 10px 18px;
      font-weight: bold;
      font-family: 'Fira Code', monospace;
      text-decoration: none;
      background: #00ff77;
      color: #000;
      border-radius: 4px;
      transition: 0.3s;
    }

    .resume-buttons a:hover {
      background: #00cc66;
      box-shadow: 0 0 10px rgba(0, 255, 119, 0.4);
    }

    .terminal-footer {
      margin-top: 2rem;
      color: #00ff77;
      text-align: center;
    }

    .terminal-footer a {
      color: #00ff77;
      text-decoration: none;
      margin: 0 5px;
    }

    .terminal-footer a:hover {
      text-decoration: underline;
      text-shadow: 0 0 8px rgba(0, 255, 119, 0.4);
    }
  </style>
</head>
<body>
  <div class="resume-wrapper">
    <div class="resume-container">
      <iframe class="resume-pdf" src="resume_ats.pdf#toolbar=0&navpanes=0&scrollbar=0"></iframe>
    </div>

    <div class="resume-buttons">
      <a href="assets/resumes/resume_ats.pdf" download>Download ATS</a>
      <a href="index.html?noIntro=true">← Back to Terminal</a>
    </div>

    <div class="terminal-footer">
      [ <a href="index.html?noIntro=true">home</a> ]
      [ <a href="projects.html">projects/</a> ]
      [ <a href="resume.html">resume</a> ]
      [ <a href="about.html">about</a> ]
      [ <a href="contact.html">contact</a> ]
    </div>
    </body>
    </html>
    
</body>
</html>
